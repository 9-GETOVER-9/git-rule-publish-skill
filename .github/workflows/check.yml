name: Skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/manage.py check
      - run: python scripts/public_check.py
      - run: python scripts/check_readme.py --root .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/manage.py build --output skill-install.zip
      - run: python scripts/manage.py verify-zip --archive skill-install.zip
